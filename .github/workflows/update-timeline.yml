name: Update KR-TW timeline

on:
  schedule:
    - cron: '35 2 * * *' # 每天台灣時間 10:35
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-timeline.yml'
      - 'scripts/**'
      - 'tests/**'
      - 'timeline/curated.json'
      - 'timeline/localization.json'
      - 'timeline/translations.json'
  pull_request:
    paths:
      - '.github/workflows/update-timeline.yml'
      - 'scripts/**'
      - 'tests/**'
      - 'timeline/curated.json'
      - 'timeline/localization.json'
      - 'timeline/translations.json'

permissions:
  contents: read

concurrency:
  group: timeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: ${{ github.event_name != 'pull_request' }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Test parsing, classification and evidence validation
        run: python -m unittest discover -s tests -v
      - name: Restore official-page cache
        if: github.event_name != 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: .cache/timeline
          key: timeline-v1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: timeline-v1-${{ runner.os }}-
      - name: Refresh official sources and generate JSON
        if: github.event_name != 'pull_request'
        run: python scripts/update_timeline.py
      - name: Validate catalog offline for pull requests
        if: github.event_name == 'pull_request'
        run: python scripts/update_timeline.py --offline
      - name: Preserve fetched-page cache even when parsing fails
        if: always() && github.event_name != 'pull_request'
        uses: actions/cache/save@v4
        with:
          path: .cache/timeline
          key: timeline-v1-${{ runner.os }}-${{ github.run_id }}
      - name: Upload JSON result
        uses: actions/upload-artifact@v4
        with:
          name: update-timeline
          path: update-timeline.json
      - name: Commit only generated data
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add update-timeline.json timeline/source-index.json timeline/translations.json
          if git diff --cached --quiet; then
            echo 'Timeline is unchanged.'
          else
            git commit -m 'chore: refresh KR-TW update timeline'
            git push origin HEAD:main
          fi
